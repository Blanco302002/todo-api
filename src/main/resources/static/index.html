<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>todoapi</title>
    <!-- Bootstrap CSS from a CDN: gives us ready-made styles (cards, buttons, lists) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">
    <h1 class="mb-4">Mis tareas</h1>

    <!-- the "box" to create a task -->
    <div class="card mb-4">
        <div class="card-body">
            <form id="task-form">
                <div class="mb-3">
                    <input id="title" class="form-control" placeholder="Título" required>
                </div>
                <div class="mb-3">
                    <input id="description" class="form-control" placeholder="Descripción (opcional)">
                </div>
                <button type="submit" class="btn btn-primary">Agregar</button>
            </form>
            <!-- error messages from the API show up here -->
            <div id="error" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>

    <!-- the list: app.js fills it with one <li> per task -->
    <ul id="task-list" class="list-group"></ul>
</div>

<!-- our JavaScript: talks to the REST API with fetch -->
<script src="app.js"></script>
</body>
</html>
